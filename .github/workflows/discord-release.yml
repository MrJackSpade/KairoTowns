name: Discord release announcement

# Announces a release in the Kairo Discord releases channel, which every Kairo app shares. Releases published
# by tag-builds.yml use GITHUB_TOKEN, which does not raise release events, so that workflow
# dispatches this one directly. Releases published by hand arrive as events.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce'
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: MrJackSpade/Kairo/.github/actions/discord-release@705f9d055d3d69273af523c6a1092d9cd378b3d8
        with:
          webhook: ${{ secrets.KAIRO_DISCORD_RELEASE_WEBHOOK }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}

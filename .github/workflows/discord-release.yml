name: Discord release announcement

# Announces a release in the Kairo Discord forum, which every Kairo app shares. Releases published
# by tag-builds.yml use GITHUB_TOKEN, which does not raise release events, so that workflow
# dispatches this one directly. Releases published by hand arrive as events.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce'
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: MrJackSpade/Kairo/.github/actions/discord-release@375bd4e0cb273d804b075aa96074724ec7f1872f
        with:
          webhook: ${{ secrets.KAIRO_DISCORD_WEBHOOK }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}
